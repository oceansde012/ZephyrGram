name: Release

# Builds a signed arm64-v8a APK. Manual runs default to an Actions preview artifact;
# pushing a vX.Y.Z tag retains the existing public GitHub Release behaviour.
#
# Required repository secrets:
#   ZEPHYR_KEYSTORE_BASE64    base64 of the release keystore (.jks), e.g. `base64 -w0 zephyr.jks`
#   ZEPHYR_KEYSTORE_PASSWORD  keystore password
#   ZEPHYR_KEY_ALIAS          key alias
#   ZEPHYR_KEY_PASSWORD       key password
#   TG_API_ID                 Telegram api_id from https://my.telegram.org
#   TG_API_HASH               Telegram api_hash from https://my.telegram.org

on:
  push:
    branches:
      - 'feature/neon-memory-bridge'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.1.0). The release tag will be v<version>.'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release (off = build a preview artifact only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/neon-memory-bridge' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Free disk space
        run: |
          df -h /
          # The NDK build of the native libraries needs a lot of space. The Android SDK is kept.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${INPUT_VERSION}"
            publish=false
            if [[ "${INPUT_PUBLISH}" == "true" ]]; then publish=true; fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            raw="${GITHUB_REF_NAME}"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/feature/neon-memory-bridge" ]]; then
            raw="0.2.2"
            publish=false
          else
            echo "error: only a manual run, the memory bridge preview branch, or a v-prefixed tag push is supported" >&2
            exit 1
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: '$raw' is not a semver version (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version: $version; publish: $publish"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch submodules
        run: bash scripts/init-submodules.sh

      - name: Check APK version counter
        id: counter
        run: |
          counter="$(sed -n 's/^ZEPHYR_VERSION_CODE=\([0-9][0-9]*\)$/\1/p' gradle.properties)"
          if [[ ! "$counter" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: gradle.properties must contain one positive ZEPHYR_VERSION_CODE" >&2
            exit 1
          fi
          echo "value=$counter" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy bytecode
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Android SDK packages
        run: |
          # ubuntu-latest ships an Android SDK with cmdline-tools, so android-actions/setup-android
          # (which runs `sdkmanager tools`, a package that no longer exists) is not used.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(ls -d "$sdk"/cmdline-tools/latest/bin/sdkmanager "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -z "$sdkmanager" ]]; then
            echo "error: sdkmanager not found under $sdk/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $sdkmanager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          { yes || true; } | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools" >/dev/null
          ls "$sdk/build-tools" "$sdk/ndk"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ZEPHYR_KEYSTORE_BASE64: ${{ secrets.ZEPHYR_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ZEPHYR_KEYSTORE_BASE64}" ]]; then
            echo "error: secret ZEPHYR_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/zephyr-release.jks"
          printf '%s' "${ZEPHYR_KEYSTORE_BASE64}" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ZEPHYR_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Write ABI init script (arm64-v8a only)
        run: |
          cat > "${RUNNER_TEMP}/abi-arm64.gradle" <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      p.android.productFlavors.all { f ->
                          f.ndk.abiFilters.clear()
                          f.ndk.abiFilters.add('arm64-v8a')
                      }
                  }
              }
          }
          EOF

      - name: Build release APK
        timeout-minutes: 120
        env:
          ZEPHYR_KEYSTORE_PASSWORD: ${{ secrets.ZEPHYR_KEYSTORE_PASSWORD }}
          ZEPHYR_KEY_ALIAS: ${{ secrets.ZEPHYR_KEY_ALIAS }}
          ZEPHYR_KEY_PASSWORD: ${{ secrets.ZEPHYR_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # TG_API_ID / TG_API_HASH reach Gradle through the environment (read by TMessagesProj/build.gradle),
          # so they never appear on the command line.
          if [[ -z "${TG_API_ID}" || -z "${TG_API_HASH}" ]]; then
            echo "error: secrets TG_API_ID and TG_API_HASH must be set" >&2
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g \
            --init-script "${RUNNER_TEMP}/abi-arm64.gradle" \
            -PZEPHYR_VERSION_NAME="${VERSION}" \
            assembleAfatRelease

      - name: Locate, verify and rename APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION_COUNTER: ${{ steps.counter.outputs.value }}
        run: |
          mapfile -t apks < <(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "error: expected exactly one APK, found ${#apks[@]}:" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi
          apksigner="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if ! "$apksigner" verify "${apks[0]}"; then
            echo "error: the APK is not signed (check the ZEPHYR_* signing secrets)" >&2
            exit 1
          fi
          if [[ "${PUBLISH}" == "true" ]]; then
            out="ZephyrGram-${VERSION}-arm64-v8a.apk"
          else
            out="ZephyrGram-${VERSION}-preview-arm64-v8a.apk"
          fi
          mkdir -p dist
          cp "${apks[0]}" "dist/$out"
          # Certificate digests are public APK metadata, not signing key material.
          certificate="$("$apksigner" verify --print-certs "dist/$out" | sed -n '/certificate SHA-256 digest:/p')"
          if [[ -z "$certificate" ]]; then
            echo "error: the verified APK did not expose a signing certificate digest" >&2
            exit 1
          fi
          printf '%s\n' "$certificate" > dist/signing-certificate-sha256.txt
          package_info="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "dist/$out" | sed -n '1p')"
          {
            printf 'ZephyrGram version: %s\n' "$VERSION"
            printf 'ZephyrGram version counter: %s\n' "$VERSION_COUNTER"
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Source ref: %s\n' "$GITHUB_REF"
            printf 'Public release requested: %s\n' "$PUBLISH"
            printf 'APK package metadata: %s\n' "$package_info"
          } > dist/build-info.txt
          (cd dist && sha256sum "$out" > SHA256SUMS.txt)
          ls -l dist
          echo "path=dist/$out" >> "$GITHUB_OUTPUT"

      - name: Upload preview APK and certificate report
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrGram-preview-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: dist/*
          retention-days: 3
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ZephyrGram ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          # vX.Y.Z-beta1 style tags become pre-releases, which releases/latest (the in-app updater) skips.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/zephyr-release.jks"

